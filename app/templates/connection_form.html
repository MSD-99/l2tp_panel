{% extends "base.html" %}
{% block page_title %}{{ t('new_connection_title') }}{% endblock %}
{% block content %}
<div class="card" style="max-width: 520px;">
  {% for err in errors %}
  <div class="error-banner">{{ err }}</div>
  {% endfor %}

  <form method="post" action="/connections/new">
    <label for="label">{{ t('conn_label_hint') }}</label>
    <input type="text" id="label" name="label" required>

    <label for="source_node_id">{{ t('source_node') }}</label>
    <select id="source_node_id" name="source_node_id" required>
      {% for n in nodes %}<option value="{{ n.id }}">{{ n.label }} ({{ n.subnet_cidr }})</option>{% endfor %}
    </select>

    <label for="target_node_id">{{ t('target_node') }}</label>
    <select id="target_node_id" name="target_node_id" required>
      {% for n in nodes %}<option value="{{ n.id }}">{{ n.label }} ({{ n.subnet_cidr }})</option>{% endfor %}
    </select>

    <label for="mode">{{ t('access_mode') }}</label>
    <select id="mode" name="mode" required>
      <option value="two_way">{{ t('mode_two_way') }}</option>
      <option value="one_way">{{ t('mode_one_way') }}</option>
    </select>



    <button type="submit" class="btn btn-primary full-btn">{{ t('create_connection_submit') }}</button>
  </form>
</div>
{% endblock %}
